<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>SWISSAM · Управленческий радар</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20334e;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button{cursor:pointer;font:inherit}#app{min-height:100vh}.layout{display:flex;min-height:100vh}.aside{width:250px;flex-shrink:0;background:#132540;color:white;padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:.07em}.brand i{display:grid;place-items:center;background:#b99a66;color:white;width:42px;height:42px;border-radius:9px;font:28px Georgia,serif}.brand small{display:block;font-size:11px;font-weight:400;letter-spacing:0;color:#aabdd5}.aside-label{font-size:10px;letter-spacing:.15em;color:#91a4c1;margin:53px 4px 15px}.aside nav{display:grid;gap:6px}.aside nav button{border:0;text-align:left;background:transparent;color:#d4dfed;padding:12px 13px;border-radius:9px;font-size:13px}.aside nav button:before{content:"●";color:#bf9b60;margin-right:13px;font-size:10px}.aside nav button.active,.aside nav button:hover{background:#2e4769;color:white}.aside-foot{margin-top:auto;color:#aebfd4;font-size:12px;border-top:1px solid #435775;padding:20px 9px 0}.main{flex:1;min-width:0}.top{height:64px;background:white;border-bottom:1px solid #e2e9f2;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 clamp(20px,4vw,54px);font-size:12px;color:#72849d}.content{max-width:1500px;margin:0 auto;padding:30px clamp(20px,4vw,54px)}.hero{border-radius:17px;background:linear-gradient(110deg,#172b49,#2a496b);color:white;padding:35px 40px;display:flex;justify-content:space-between;align-items:center;gap:20px}.caps{font-size:11px;font-weight:750;letter-spacing:.12em;color:#c6a16b}.hero h1{font-size:clamp(29px,3.8vw,44px);line-height:1.12;letter-spacing:-.03em;margin:13px 0 12px}.hero p{font-size:14px;line-height:1.6;color:#c4d1e0;margin:0;max-width:650px}.calendar{border:1px solid #6a7e99;border-radius:10px;padding:11px 19px;text-align:center}.calendar strong{display:block;font-size:43px;line-height:1.15;font-weight:500}.calendar small{display:block;font-size:10px;color:#dbbf86;letter-spacing:.11em}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:16px 0 29px}.kpi{background:white;border:1px solid #e0e6ef;border-radius:11px;padding:17px 19px;display:flex;align-items:center;justify-content:space-between;gap:8px}.kpi span{font-size:10px;letter-spacing:.08em;color:#8190a7;font-weight:750}.kpi b{font-size:29px;font-weight:680}.section{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:27px 0 14px}.section h2{font-size:20px;letter-spacing:-.02em;margin:0}.section span{font-size:12px;color:#8495ad}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:white;text-align:left;display:flex;flex-direction:column;min-height:200px;padding:24px;border:1px solid #dfe6ef;border-radius:13px}.card:hover{box-shadow:0 12px 25px #1a345514}.card .num{font-size:12px;color:#acbbcd}.card h3{font-size:20px;line-height:1.2;margin:18px 0 9px}.card p{font-size:13px;line-height:1.7;color:#71839d;flex:1;margin:0}.card-foot{margin-top:20px;padding-top:13px;border-top:1px solid #e9eff5;display:flex;justify-content:space-between;font-size:11px;color:#8b9cb0}.card-foot b{color:#355f96}.box{background:white;border:1px solid #dfe6ef;border-radius:13px;padding:22px}.box h2{font-size:19px;margin:10px 0 15px}.box ol{padding-left:23px}.box li{font-size:14px;color:#506783;line-height:1.7;margin:8px 0}.milestone{font-size:12px;color:#8295ad;border-top:1px solid #e9eef5;padding-top:13px;margin-top:18px}.events{padding:0 23px}.event{padding:19px 0;border-bottom:1px solid #e9edf5}.event:last-child{border:0}.event-main{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.tag{display:inline-flex;background:#f8f0e4;color:#9c773b;padding:4px 8px;font-size:10px;font-weight:800;border-radius:5px}.event h3{font-size:15px;margin:8px 0 5px}.event p{font-size:12px;color:#7c8ca2;margin:0}.state{font-size:11px;font-weight:700;padding:6px 10px;border-radius:7px;background:#eef2f7;color:#647b9b;white-space:nowrap}.state.progress{background:#fff1d5;color:#986c28}.state.done{background:#e4f4e9;color:#28734e}.state.blocked{background:#fae6e4;color:#b45555}.result{border-left:3px solid #7ca78b;background:#f4f8fc;padding:12px 15px;margin-top:13px}.result b{font-size:12px}.result p{font-size:13px;white-space:pre-wrap;margin-top:6px;color:#425b78}.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.bottom-grid p{font-size:13px;line-height:1.7;color:#74859c}.footer{padding-top:18px;margin-top:30px;border-top:1px solid #e0e7ef;display:flex;justify-content:space-between;gap:15px;font-size:11px;color:#8b9caf}.locked{max-width:520px;margin:14vh auto;padding:35px;background:white;border:1px solid #dde5f0;border-radius:17px;box-shadow:0 8px 28px #18365709}.locked h1{font-size:26px}.locked p{font-size:14px;color:#72849e;line-height:1.7}
@media(max-width:930px){.layout{display:block}.aside{position:static;height:auto;width:100%;padding:17px}.aside-label,.aside-foot{display:none}.aside nav{display:flex;overflow-x:auto;padding-top:14px}.aside nav button{white-space:nowrap}.content{padding:20px 16px}}@media(max-width:650px){.cards,.bottom-grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.hero{padding:23px}.calendar{display:none}.event-main{display:block}.state{display:inline-block;margin-top:12px}.card{min-height:172px}.footer{display:block}.footer span{display:block;margin:4px 0}}
</style></head><body>
<div id="app"><div class="locked"><h1>Закрытая панель SWISSAM</h1><p>Подключаем защищённые данные…</p></div></div>
<script>
const node=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),from64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),x=>x.charCodeAt(0));
let data,tab='Обзор';
const points=n=>n===1?'пункт результата':n>=2&&n<=4?'пункта результата':'пунктов результата';
const statusNames={plan:'Запланировано',progress:'В работе',done:'Выполнено',blocked:'Нужно решение'};
function locked(msg){node.innerHTML='<div class="locked"><h1>Доступ к отчёту</h1><p>'+esc(msg)+'</p><p>Откройте полную ссылку, полученную от руководителя ДПО.</p></div>'}
function show(){
 const p=data.projects.find(x=>x.code===tab),name=p?.name|| (tab==='Встречи'?'Дополнительные события':'Программы и результаты');
 const items=data.items.filter(x=>tab==='Обзор'||tab==='Встречи'?tab==='Обзор'||['Продажи','HM'].includes(x.project):x.project===tab);
 let s='<div class="layout"><aside class="aside"><div class="brand"><i>S</i><span>SWISSAM<small>Управление ДПО</small></span></div><div class="aside-label">РАБОЧЕЕ ПРОСТРАНСТВО</div><nav>'+['Обзор',...data.projects.map(x=>x.code),'Встречи'].map(x=>'<button data-tab="'+esc(x)+'" class="'+(tab===x?'active':'')+'">'+esc(x==='Обзор'?'Обзор дня':x==='Встречи'?'Дополнительно':data.projects.find(z=>z.code===x)?.name)+'</button>').join('')+'</nav><div class="aside-foot">Управленческий отчёт<br>Только просмотр</div></aside><div class="main"><div class="top"><span>SWISSAM / ДПО / '+esc(tab)+'</span><span>26 ноября 2026</span></div><div class="content"><div class="hero"><div><span class="caps">УПРАВЛЕНЧЕСКИЙ РАДАР · 26 НОЯБРЯ</span><h1>'+esc(name)+'</h1><p>'+esc(p?.description||'Что запланировано, каких результатов ожидаем и что фактически выполнено.')+'</p></div><div class="calendar"><strong>26</strong><small>НОЯ 2026</small></div></div>';
 const stats=[['ПРОЕКТА',data.projects.length],['СОБЫТИЙ ДНЯ',data.items.length],['В РАБОТЕ',data.items.filter(x=>x.status==='progress').length],['ВЫПОЛНЕНО',data.items.filter(x=>x.status==='done').length]];
 s+='<div class="kpis">'+stats.map(x=>'<div class="kpi"><span>'+esc(x[0])+'</span><b>'+String(x[1]).padStart(2,'0')+'</b></div>').join('')+'</div>';
 if(tab==='Обзор')s+='<div class="section"><h2>Направления работы</h2><span>Результаты 26 ноября</span></div><div class="cards">'+data.projects.map((x,i)=>'<button class="card" data-tab="'+esc(x.code)+'"><span class="num">0'+(i+1)+'</span><h3>'+esc(x.name)+'</h3><p>'+esc(x.description)+'</p><div class="card-foot"><span>'+x.results.length+' пункта результата</span><b>Открыть ↗</b></div></button>').join('')+'</div>';
 if(p)s+='<div class="box" style="margin-top:16px"><span class="caps">КРИТЕРИИ РЕЗУЛЬТАТА</span><h2>Что должно получиться</h2><ol>'+p.results.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><div class="milestone">'+esc(p.milestone)+'</div></div>';
 s+='<div class="section"><h2>'+(tab==='Обзор'?'Встречи и занятия':'События по направлению')+'</h2><span>'+items.length+' записей</span></div><div class="box events">';
 s+=items.map(x=>'<div class="event"><div class="event-main"><div><span class="tag">'+esc(x.project)+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.detail)+'</p></div><span class="state '+esc(x.status)+'">'+esc(statusNames[x.status]||'Статус не подтверждён')+'</span></div>'+(x.result?'<div class="result"><b>Фактический результат</b><p>'+esc(x.result)+'</p></div>':'')+'</div>').join('')||'<p style="padding:20px 0;color:#8193aa;font-size:13px">На сегодня отдельных встреч по направлению не указано.</p>';
 s+='</div>';
 if(tab==='Обзор')s+='<div class="bottom-grid"><div class="box"><span class="caps">ПО ИТОГАМ ДНЯ</span><h2>Что важно зафиксировать</h2><p>Результаты двух интервью GM, встреч по ЛС, Digital, продажам и наблюдения из обучения HM.</p></div><div class="box"><span class="caps">СТАТУСЫ</span><h2>План ≠ выполнение</h2><p>Результаты отображаются только после подтверждения и внесения в рабочий реестр.</p></div></div>';
 s+='<footer class="footer"><span>SWISSAM · защищённая управленческая панель</span><span>Последнее обновление: '+esc(data.publishedAt||'не указано')+'</span></footer></div></div></div>';
 node.innerHTML=s;
}
node.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;show();scrollTo(0,0)}});
(async()=>{
 const match=location.hash.match(/(?:^#|&)k=([^&]+)/);
 if(!match){locked('Данные не публикуются открыто. Нужна персональная ссылка с ключом доступа.');return}
 try{
  const key=await crypto.subtle.importKey('raw',from64(match[1]),{name:'AES-GCM'},false,['decrypt']);
  const res=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw Error('offline');
  const v=await res.json(),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(v.iv)},key,from64(v.ciphertext));
  data=JSON.parse(new TextDecoder().decode(plain));
  if(!Array.isArray(data.projects)||!Array.isArray(data.items))throw Error('invalid');
  show()
 }catch{locked('Ссылка неполная, данные ещё недоступны или ключ не подходит.')}
})();
</script></body></html>
