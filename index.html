.priority-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.priority-column{background:#fff;border:1px solid #e1e8f0;border-top:4px solid #9fb0c6;border-radius:12px;padding:17px;min-height:180px}.priority-column.urgent{border-top-color:#b97c51}.priority-column.important{border-top-color:#698db7}.priority-column.attention{border-top-color:#b89d61}.priority-column>header{display:flex;justify-content:space-between;align-items:center;gap:8px}.priority-col-title{display:flex;align-items:center;gap:9px}.priority-col-title h3{font-size:14px;line-height:1.35;font-weight:750;margin:0}.task-lane-mark{width:9px;height:9px;display:inline-block;border-radius:50%;flex-shrink:0}.task-lane-mark.urgent{background:#b97c51}.task-lane-mark.important{background:#698db7}.task-lane-mark.attention{background:#b89d61}.priority-count{background:#f0f4f9;color:#576a84;padding:4px 8px;font-size:12px;border-radius:7px;font-weight:700}.priority-desc{font-size:11px;color:#9aabc0;margin:7px 0 14px}.priority-rows{display:grid;gap:8px}.priority-rows button{display:flex;align-items:flex-start;gap:7px;text-align:left;background:#f8fafc;border:1px solid #eaf0f6;border-radius:9px;width:100%;padding:10px}.priority-rows button:hover{background:#f1f6fb;border-color:#c9d9ec}.priority-rows small{display:inline-block;color:#b28d54;background:#f6efe2;padding:3px 5px;border-radius:4px;font-size:10px;font-weight:800;white-space:nowrap}.priority-rows button span{flex:1;font-size:12px;color:#425672;line-height:1.45}.priority-rows button b{color:#738aab;font-size:13px}.priority-more{background:none;border:0;padding:12px 2px 0;color:#3a669c;font-size:11px;font-weight:750}.priority-empty{font-size:12px;color:#91a2b6;margin:9px}

.project-goals{margin-top:16px}.project-goals .program-links{margin-top:19px}.task-group{margin-bottom:19px}.task-group-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.task-group-head h3{font-size:15px;margin:0;font-weight:750}.task-group-head span:last-child{font-size:11px;color:#8797ac}.task-list{background:#fff;border:1px solid #e2e9f2;border-radius:12px;padding:0 17px}.task{border-bottom:1px solid #ebeff5}.task:last-child{border-bottom:0}.task>summary{list-style:none;cursor:pointer;display:flex;gap:12px;justify-content:space-between;align-items:center;padding:16px 2px}.task>summary::-webkit-details-marker{display:none}.task-summary-left{flex:1;min-width:0}.task-prio{font-size:10px;font-weight:700;display:inline-block;color:#6b7e99;border-radius:5px;padding:4px 7px;margin-bottom:7px;background:#eef3f9}.task-prio.urgent{background:#fff0e3;color:#9b6b3b}.task-prio.important{background:#eaf2fc;color:#416c9b}.task-prio.attention{background:#fcf2dd;color:#9d7a2b}.task-name{font-size:14px;font-weight:700;color:#2d4360}.task-source{display:inline-block;font-size:11px;color:#90a0b3;margin-top:6px}.task-chevron{color:#7c90ad;font-size:19px}.task[open] .task-chevron{transform:rotate(180deg)}.task-body{background:#f8fafc;border-top:1px solid #eaf0f6;border-radius:0 0 8px 8px;padding:14px 15px 17px;color:#5a6c85}.task-body>p{font-size:13px;line-height:1.6;margin:0 0 12px}.task-origin{font-size:11px;color:#899ab1;line-height:1.5}.task-result{margin-top:15px;border-left:3px solid #b1c4d9;padding:8px 12px;background:white}.task-result strong{font-size:11px;color:#47607e}.task-result p{margin:5px 0 0;font-size:12px;color:#6b7f9b;white-space:pre-wrap}.events .event{display:block;text-align:left;width:100%;background:none;border:0;border-bottom:1px solid #e9edf5;cursor:pointer}.events .event:hover{background:#f9fbfe}.events .event:last-child{border-bottom:0}

</style></head><body>
<div id="app"><div class="locked"><h1>Закрытая панель SWISSAM</h1><p>Подключаем защищённые данные…</p></div></div>
<script>
const node=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const from64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),x=>x.charCodeAt(0));
const statusNames={plan:'Запланировано',progress:'В работе',done:'Выполнено',blocked:'Нужно решение'};
const lanes=[
 {id:'urgent',name:'Важно и срочно',desc:'Ближайшие встречи и вехи',color:'urgent'},
 {id:'important',name:'Важно, не срочно',desc:'Разработка и развитие программ',color:'important'},
 {id:'attention',name:'Требует внимания',desc:'Открытые решения и зависимости',color:'attention'}
];
let data,tab='Обзор',selectedTask='';
const plural=(n,one,two,five)=>n%10===1&&n%100!==11?one:n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?two:five;
function locked(msg){node.innerHTML='<div class="locked"><h1>Доступ к отчёту</h1><p>'+esc(msg)+'</p><p>Откройте полную ссылку, полученную от руководителя ДПО.</p></div>'}
const active=t=>t.status!=='done';
const prio=t=>lanes.find(p=>p.id===t.lane)||lanes[1];
const siteLinks=p=>{
 if(!p)return '';
 let s='<div class="program-links">';
 if(p.siteUrl&&/^https:\/\//i.test(p.siteUrl)){
   s+='<a class="site-link verified" target="_blank" rel="noreferrer noopener" href="'+esc(p.siteUrl)+'">Открыть сайт программы ↗</a>';
   if(p.siteNote&&p.siteNote.includes('вход'))s+='<span class="site-note">Требуется вход через ChatGPT</span>';
 }else if(p.relatedSiteUrl&&/^https:\/\//i.test(p.relatedSiteUrl)){
   s+='<a class="site-link" target="_blank" rel="noreferrer noopener" href="'+esc(p.relatedSiteUrl)+'">Смежная студия «Лидер лидеров» ↗</a>';
   s+='<span class="site-note">Отдельный сайт ЛС не установлен; соответствие программ не подтверждено</span>';
 }else{
   s+='<span class="site-missing">Отдельная ссылка на сайт пока не найдена</span>';
 }
 if(p.registryUrl&&/^https:\/\//i.test(p.registryUrl)){
   s+='<a class="site-link" target="_blank" rel="noreferrer noopener" href="'+esc(p.registryUrl)+'">Общий реестр ДПО ↗</a>';
   s+='<span class="site-note">Требуется вход</span>';
 }
 return s+'</div>'
};
function taskSummary(t){
 const label=prio(t);
 return '<summary><div class="task-summary-left"><span class="task-prio '+label.color+'">'+esc(label.name)+'</span><div class="task-name">'+esc(t.title)+'</div><span class="task-source">'+esc(t.project)+(t.due?' · Срок '+esc(t.due.split('-').reverse().join('.')):' · Срок не установлен')+'</span></div><span class="state '+esc(t.status)+'">'+esc(statusNames[t.status]||t.status)+'</span><span class="task-chevron">⌄</span></summary>';
}
function taskDetail(t){
 return '<details class="task" id="task-'+esc(t.id)+'" '+(selectedTask===t.id?'open':'')+'>'+taskSummary(t)+'<div class="task-body"><p>'+esc(t.detail)+'</p><div class="task-origin"><strong>Основание:</strong> '+esc(t.source||'Рабочий план ДПО')+'</div><div class="task-result"><strong>Фактический результат</strong><p>'+esc(t.result||'Не подтверждён')+'</p></div></div></details>'
}
function groupedTasks(items){
 const groups=lanes.map(l=>({lane:l,items:items.filter(t=>prio(t).id===l.id)}));
 return groups.filter(g=>g.items.length).map(g=>'<section class="task-group"><div class="task-group-head"><span class="task-lane-mark '+g.lane.color+'"></span><h3>'+esc(g.lane.name)+'</h3><span>'+g.items.length+'</span></div><div class="task-list">'+g.items.map(taskDetail).join('')+'</div></section>').join('');
}
function priorityBoard(short=false){
 let s='<div class="priority-intro"><div><h2>Приоритеты и управленческое внимание</h2><p>Рабочая классификация по близости сроков и открытым решениям. Статус выполнения указан отдельно.</p></div>';
 if(short)s+='<button data-tab="Приоритеты">Все приоритеты ↗</button>';
 s+='</div><div class="priority-grid">';
 s+=lanes.map(l=>{
  const items=data.items.filter(t=>prio(t).id===l.id&&active(t));
  const displayed=short?items.slice(0,3):items;
  return '<section class="priority-column '+l.color+'"><header><div class="priority-col-title"><span class="task-lane-mark '+l.color+'"></span><h3>'+esc(l.name)+'</h3></div><span class="priority-count">'+items.length+'</span></header><p class="priority-desc">'+esc(l.desc)+'</p><div class="priority-rows">'+displayed.map(t=>'<button data-task="'+esc(t.id)+'"><small>'+esc(t.project)+'</small><span>'+esc(t.title)+'</span><b>↗</b></button>').join('')+(items.length===0?'<p class="priority-empty">Активных задач нет</p>':'')+'</div>'+(short&&items.length>displayed.length?'<button class="priority-more" data-tab="Приоритеты">Ещё '+(items.length-displayed.length)+' ↗</button>':'')+'</section>';
 }).join('');
 return s+'</div>'
}
function projectCard(x,i){
 const count=data.items.filter(t=>t.project===x.code).length;
 return '<article class="card project-card"><div class="card-topline"><span class="num">0'+(i+1)+'</span><span class="project-task-count">'+count+' '+plural(count,'задача','задачи','задач')+'</span></div><button class="card-open" data-tab="'+esc(x.code)+'"><h3>'+esc(x.name)+'</h3><p>'+esc(x.description)+'</p><span class="card-open-hint">Посмотреть задачи и результаты →</span></button>'+siteLinks(x)+'</article>'
}
function show(){
 const p=data.projects.find(x=>x.code===tab);
 const isPriority=tab==='Приоритеты';
 const name=p?.name|| (tab==='Встречи'?'Встречи и обучение':isPriority?'Матрица приоритетов':'Программы и результаты');
 const items=data.items.filter(x=>tab==='Обзор'||(tab==='Встречи'&&['Продажи','HM'].includes(x.project))||x.project===tab);
 let s='<div class="layout"><aside class="aside"><div class="brand"><i>S</i><span>SWISSAM<small>Управление ДПО</small></span></div><div class="aside-label">РАБОЧЕЕ ПРОСТРАНСТВО</div><nav>'+['Обзор','Приоритеты',...data.projects.map(x=>x.code),'Встречи'].map(x=>'<button data-tab="'+esc(x)+'" class="'+(tab===x?'active':'')+'">'+esc(x==='Обзор'?'Обзор дня':x==='Встречи'?'Дополнительно':x==='Приоритеты'?'Приоритеты задач':data.projects.find(z=>z.code===x)?.name)+'</button>').join('')+'</nav><div class="aside-foot">Управленческий отчёт<br>Только просмотр</div></aside><div class="main"><div class="top"><span>SWISSAM / ДПО / '+esc(tab)+'</span><span>26 ноября 2026</span></div><div class="content"><div class="hero"><div><span class="caps">УПРАВЛЕНЧЕСКИЙ РАДАР · 26 НОЯБРЯ</span><h1>'+esc(name)+'</h1><p>'+esc(p?.description|| (isPriority?'Какие задачи важны сейчас, какие требуют системной работы, а где необходимы решения.':'Что запланировано, каких результатов ожидаем и что фактически выполнено.'))+'</p></div><div class="calendar"><strong>26</strong><small>НОЯ 2026</small></div></div>';
 const stats=[['ПРОЕКТА',data.projects.length],['ЗАДАЧИ',data.items.length],['ВАЖНО И СРОЧНО',data.items.filter(t=>t.lane==='urgent'&&active(t)).length],['ТРЕБУЕТ ВНИМАНИЯ',data.items.filter(t=>t.lane==='attention'&&active(t)).length]];
 s+='<div class="kpis">'+stats.map(x=>'<div class="kpi"><span>'+esc(x[0])+'</span><b>'+String(x[1]).padStart(2,'0')+'</b></div>').join('')+'</div>';
 if(tab==='Обзор'){
  s+=priorityBoard(true);
  s+='<div class="section"><h2>Программы ДПО</h2><span>Нажмите программу, чтобы увидеть задачи</span></div><div class="cards">'+data.projects.map(projectCard).join('')+'</div>';
 }
 if(isPriority){s+=priorityBoard(false)}
 if(p){
  s+='<div class="box project-goals"><span class="caps">ОЖИДАЕМЫЙ РЕЗУЛЬТАТ</span><h2>Что должно получиться</h2><ol>'+p.results.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><div class="milestone">'+esc(p.milestone)+'</div>'+siteLinks(p)+'</div>';
  s+='<div class="section"><h2>Задачи программы</h2><span>'+items.length+' '+plural(items.length,'задача','задачи','задач')+'</span></div>';
  s+=groupedTasks(items);
 }else if(tab==='Встречи'){
  const meetings=data.items.filter(x=>['Продажи','HM'].includes(x.project));
  s+='<div class="section"><h2>Встречи и обучение</h2><span>'+meetings.length+' записи</span></div>'+groupedTasks(meetings);
 }else if(tab==='Обзор'){
  const events=data.items.filter(x=>['gm-anna','gm-ikon','ls-teacher','sales-rena','digital-dmitry','hm-class'].includes(x.id));
  s+='<div class="section"><h2>Шесть событий дня</h2><span>26 ноября · исходный план</span></div><div class="box events">';
  s+=events.map(x=>'<button class="event" data-task="'+esc(x.id)+'"><div class="event-main"><div><span class="tag">'+esc(x.project)+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.detail)+'</p></div><span class="state '+esc(x.status)+'">'+esc(statusNames[x.status]||'Статус не подтверждён')+'</span></div></button>').join('');
  s+='</div>';
 }
 s+='<footer class="footer"><span>SWISSAM · защищённая управленческая панель · статусы по подтверждению</span><span>Обновлено: '+esc(data.publishedAt||'не указано')+'</span></footer></div></div></div>';
 node.innerHTML=s;
 if(selectedTask){const details=document.getElementById('task-'+selectedTask);if(details){details.open=true;details.scrollIntoView({behavior:'smooth',block:'center'})}}
}
node.addEventListener('click',e=>{
 const task=e.target.closest('[data-task]');
 if(task){const t=data.items.find(x=>x.id===task.dataset.task);if(!t)return;tab=['Продажи','HM'].includes(t.project)?'Встречи':t.project;selectedTask=t.id;show();return}
 const b=e.target.closest('[data-tab]');
 if(b){tab=b.dataset.tab;selectedTask='';show();window.scrollTo(0,0)}
});
(async()=>{
 const match=location.hash.match(/(?:^#|&)k=([A-Za-z0-9_-]+)/);
 if(!match){locked('Данные не публикуются открыто. Нужна персональная ссылка с ключом доступа.');return}
 try{
  const key=await crypto.subtle.importKey('raw',from64(match[1]),{name:'AES-GCM'},false,['decrypt']);
  const res=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw Error('offline');
  const v=await res.json(),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(v.iv)},key,from64(v.ciphertext));
  data=JSON.parse(new TextDecoder().decode(plain));
  if(!Array.isArray(data.projects)||!Array.isArray(data.items))throw Error('invalid');
  show()
 }catch{locked('Ссылка неполная, данные ещё недоступны или ключ не подходит.')}
})();
</script></body></html>
